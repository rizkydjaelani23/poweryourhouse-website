name: Daily Blog Post

on:
  schedule:
    # 8 AM AEST = 10 PM UTC (previous day)
    - cron: "0 22 * * *"
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  write-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Anthropic SDK
        run: npm install @anthropic-ai/sdk

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-blog-post.mjs

      - name: Commit and push
        run: |
          git config user.name "Blog Bot"
          git config user.email "bot@poweryourhouse.io"
          git add app/blog/posts.ts
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add daily blog post [$(date +%Y-%m-%d)]"
          git push
