name: Daily Blog Rebuild

on:
  schedule:
    # 8 AM AEST = 10 PM UTC (previous day)
    - cron: "0 22 * * *"
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Trigger daily rebuild
        run: |
          git config user.name "Blog Bot"
          git config user.email "bot@poweryourhouse.io"
          git commit --allow-empty -m "Daily rebuild [$(date +%Y-%m-%d)]"
          git push
